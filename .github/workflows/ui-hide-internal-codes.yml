name: UI hide internal codes

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ui-hide-internal-codes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply global UI rule
        shell: bash
        run: |
          set -euo pipefail
          FILE="public/assets/js/app-feedback.js"
          MARKER="BIGNET_GLOBAL_INTERNAL_CODE_UI_RULE_2026_08_19"
          if ! grep -q "$MARKER" "$FILE"; then
            cat >> "$FILE" <<'JS'

/* BIGNET_GLOBAL_INTERNAL_CODE_UI_RULE_2026_08_19
 * Internal/generated codes stay in backend/database/URLs, but are not user-facing UI.
 * Serial numbers remain visible because they identify physical units.
 */
(function (window, document) {
  'use strict';
  var CODE_RE = /\b(?:KAT|GDG|UNT|REQ|TRF|LOC)-[A-Z0-9][A-Z0-9-]*\b/gi;
  var CODE_WORD_RE = /\bkode\b/i;
  var CODE_GUIDE_RE = /\b(kode|format\s+kode|dibuat\s+otomatis.*kode|kode.*otomatis)\b/i;

  function text(el) { return (el && el.textContent || '').replace(/\s+/g, ' ').trim(); }
  function isCodeLike(value) { return CODE_RE.test(String(value || '')) || /^(?:KAT|GDG|UNT|REQ|TRF|LOC)-/i.test(String(value || '').trim()); }

  function stripCodeFromTextNodes(root) {
    var walker = document.createTreeWalker(root || document.body, NodeFilter.SHOW_TEXT);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      if (!node.nodeValue || !CODE_RE.test(node.nodeValue)) return;
      node.nodeValue = node.nodeValue.replace(CODE_RE, '').replace(/\s{2,}/g, ' ').replace(/\s+([—|-])/g, ' $1');
      if (!node.nodeValue.trim() && node.parentElement && !['SCRIPT','STYLE'].includes(node.parentElement.tagName)) {
        node.parentElement.textContent = '';
      }
    });
  }

  function hideCodeFieldBlocks(root) {
    (root || document).querySelectorAll('label').forEach(function (label) {
      var labelText = text(label);
      if (!CODE_WORD_RE.test(labelText)) return;
      var block = label.closest('.mb-4, .mb-6, .form-group, .field, .grid > div, div');
      if (!block) return;
      var controls = block.querySelectorAll('input, select, textarea');
      var hasIdentifierControl = Array.prototype.some.call(controls, function (c) {
        var value = c.value || '';
        return /auto generated/i.test(value) || isCodeLike(value) || /code|kode/i.test(c.name || '') || c.disabled;
      });
      if (hasIdentifierControl || /kode\s*\/\s*sku/i.test(labelText)) block.style.display = 'none';
    });
  }

  function hideCodeTableColumns(root) {
    (root || document).querySelectorAll('table').forEach(function (table) {
      var rows = table.rows;
      if (!rows || !rows.length) return;
      var head = rows[0];
      var removeIndexes = [];
      Array.prototype.forEach.call(head.cells, function (cell, idx) {
        var label = text(cell);
        if (CODE_WORD_RE.test(label)) removeIndexes.push(idx);
      });
      if (!removeIndexes.length) return;
      Array.prototype.slice.call(rows).forEach(function (row) {
        removeIndexes.slice().sort(function (a,b) { return b-a; }).forEach(function (idx) {
          if (row.cells[idx] && row.cells.length > 1) row.deleteCell(idx);
        });
      });
    });
  }

  function cleanPlaceholders(root) {
    (root || document).querySelectorAll('input[placeholder], textarea[placeholder]').forEach(function (el) {
      var p = el.getAttribute('placeholder') || '';
      if (!CODE_WORD_RE.test(p)) return;
      var next = p.replace(/\s*\/\s*/g, ' ').replace(/kode/ig, '').replace(/\s{2,}/g, ' ').trim();
      if (/^Cari\s*$/i.test(next)) next = 'Cari...';
      el.setAttribute('placeholder', next);
    });
  }

  function hideCodeGuidance(root) {
    (root || document).querySelectorAll('li, p, small').forEach(function (el) {
      var t = text(el);
      if (!t || !CODE_GUIDE_RE.test(t)) return;
      if (isCodeLike(t) || /dibuat\s+otomatis/i.test(t) || /^kode\b/i.test(t)) el.style.display = 'none';
    });
  }

  function run(root) {
    var scope = root || document;
    hideCodeFieldBlocks(scope);
    hideCodeTableColumns(scope);
    cleanPlaceholders(scope);
    hideCodeGuidance(scope);
    stripCodeFromTextNodes(scope === document ? document.body : scope);
  }

  function init() {
    run(document);
    var observer = new MutationObserver(function (mutations) {
      mutations.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (node) {
          if (node.nodeType === 1) run(node);
        });
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})(window, document);
JS
          fi
          git config user.name "BIGNET UI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: hide internal codes from user-facing UI"
          git push origin main
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f .github/workflows/ui-hide-internal-codes.yml
          git add .github/workflows/ui-hide-internal-codes.yml
          git commit -m "chore: remove temporary UI migration workflow"
          git push origin main
